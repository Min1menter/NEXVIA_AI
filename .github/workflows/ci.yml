# Untested template: runs the unit tests on every push / pull request.
name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install torch_geometric xgboost fastapi httpx sqlalchemy pyarrow scipy scikit-learn pandas numpy pyyaml pytest mlflow imbalanced-learn matplotlib prometheus-client
      - run: pip install -e . --no-deps
      - run: pytest -q
