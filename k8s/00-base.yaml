apiVersion: v1
kind: Namespace
metadata: {name: fraudshield}
---
apiVersion: v1
kind: Secret
metadata: {name: fraud-secrets, namespace: fraudshield}
stringData:
  POSTGRES_PASSWORD: change-me
  API_KEY: change-me
---
apiVersion: v1
kind: ConfigMap
metadata: {name: fraud-config, namespace: fraudshield}
data:
  FEATURE_BACKEND: feast
  KAFKA_BOOTSTRAP: kafka-broker:9092
  MLFLOW_TRACKING_URI: http://mlflow:5000
  API_URL: http://api:8000
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: fraud-data, namespace: fraudshield}
spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 2Gi}}}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: fraud-artifacts, namespace: fraudshield}
spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 1Gi}}}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: fraud-reports, namespace: fraudshield}
spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 500Mi}}}
