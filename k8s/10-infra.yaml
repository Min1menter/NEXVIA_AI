# Kafka (KRaft, single broker), Redis (Feast online store), Postgres (alerts/cases), MLflow.
# NOTE: service is named kafka-broker + enableServiceLinks:false (a service named "kafka" injects KAFKA_PORT env and breaks the image).
apiVersion: apps/v1
kind: Deployment
metadata: {name: kafka, namespace: fraudshield}
spec:
  replicas: 1
  selector: {matchLabels: {app: kafka}}
  template:
    metadata: {labels: {app: kafka}}
    spec:
      enableServiceLinks: false
      containers:
        - name: kafka
          image: apache/kafka:3.8.0
          ports: [{containerPort: 9092}]
          env:
            - {name: KAFKA_NODE_ID, value: "1"}
            - {name: KAFKA_PROCESS_ROLES, value: "broker,controller"}
            - {name: KAFKA_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093"}
            - {name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://kafka-broker:9092"}
            - {name: KAFKA_CONTROLLER_LISTENER_NAMES, value: CONTROLLER}
            - {name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"}
            - {name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@localhost:9093"}
            - {name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1"}
            - {name: KAFKA_NUM_PARTITIONS, value: "3"}
          resources: {requests: {memory: 512Mi, cpu: 250m}}
---
apiVersion: v1
kind: Service
metadata: {name: kafka-broker, namespace: fraudshield}
spec: {selector: {app: kafka}, ports: [{port: 9092}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: redis, namespace: fraudshield}
spec:
  replicas: 1
  selector: {matchLabels: {app: redis}}
  template:
    metadata: {labels: {app: redis}}
    spec:
      enableServiceLinks: false
      containers: [{name: redis, image: "redis:7-alpine", ports: [{containerPort: 6379}]}]
---
apiVersion: v1
kind: Service
metadata: {name: redis, namespace: fraudshield}
spec: {selector: {app: redis}, ports: [{port: 6379}]}
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: postgres, namespace: fraudshield}
spec:
  serviceName: postgres
  replicas: 1
  selector: {matchLabels: {app: postgres}}
  template:
    metadata: {labels: {app: postgres}}
    spec:
      enableServiceLinks: false
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports: [{containerPort: 5432}]
          env:
            - {name: POSTGRES_USER, value: fraud}
            - {name: POSTGRES_DB, value: fraud}
            - {name: POSTGRES_PASSWORD, valueFrom: {secretKeyRef: {name: fraud-secrets, key: POSTGRES_PASSWORD}}}
          volumeMounts: [{name: pg, mountPath: /var/lib/postgresql/data, subPath: pgdata}]
  volumeClaimTemplates:
    - metadata: {name: pg}
      spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 1Gi}}}
---
apiVersion: v1
kind: Service
metadata: {name: postgres, namespace: fraudshield}
spec: {selector: {app: postgres}, ports: [{port: 5432}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: mlflow, namespace: fraudshield}
spec:
  replicas: 1
  selector: {matchLabels: {app: mlflow}}
  template:
    metadata: {labels: {app: mlflow}}
    spec:
      enableServiceLinks: false
      containers:
        - name: mlflow
          image: ghcr.io/mlflow/mlflow:latest
          command: ["mlflow", "server", "--host", "0.0.0.0", "--backend-store-uri", "sqlite:////mlflow/mlflow.db", "--default-artifact-root", "/mlflow/artifacts"]
          ports: [{containerPort: 5000}]
          volumeMounts: [{name: m, mountPath: /mlflow}]
      volumes: [{name: m, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata: {name: mlflow, namespace: fraudshield}
spec: {selector: {app: mlflow}, ports: [{port: 5000}]}
