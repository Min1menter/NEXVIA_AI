# Images are built into Minikube's Docker daemon (see k8s/README.md), so imagePullPolicy: Never.
apiVersion: batch/v1
kind: Job
metadata: {name: bootstrap-pipeline, namespace: fraudshield}
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      enableServiceLinks: false
      containers:
        - name: pipeline
          image: fraudshield-train:latest
          imagePullPolicy: Never
          envFrom: [{configMapRef: {name: fraud-config}}]
          volumeMounts: [{name: data, mountPath: /app/data}, {name: artifacts, mountPath: /app/artifacts}, {name: reports, mountPath: /app/reports}]
          resources: {requests: {memory: 2Gi, cpu: "1"}}
      volumes: [{name: data, persistentVolumeClaim: {claimName: fraud-data}}, {name: artifacts, persistentVolumeClaim: {claimName: fraud-artifacts}}, {name: reports, persistentVolumeClaim: {claimName: fraud-reports}}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: api, namespace: fraudshield}
spec:
  replicas: 1
  selector: {matchLabels: {app: api}}
  template:
    metadata: {labels: {app: api}}
    spec:
      enableServiceLinks: false
      securityContext: {fsGroup: 1000}
      containers:
        - name: api
          image: fraudshield-serve:latest
          imagePullPolicy: Never
          ports: [{containerPort: 8000}]
          envFrom: [{configMapRef: {name: fraud-config}}]
          env: [{name: API_KEY, valueFrom: {secretKeyRef: {name: fraud-secrets, key: API_KEY}}}, {name: DATABASE_URL, value: "postgresql+psycopg2://fraud:change-me@postgres:5432/fraud"}]
          readinessProbe: {httpGet: {path: /health, port: 8000}, initialDelaySeconds: 10}
          volumeMounts: [{name: data, mountPath: /app/data}, {name: artifacts, mountPath: /app/artifacts}, {name: reports, mountPath: /app/reports}]
      volumes: [{name: data, persistentVolumeClaim: {claimName: fraud-data}}, {name: artifacts, persistentVolumeClaim: {claimName: fraud-artifacts}}, {name: reports, persistentVolumeClaim: {claimName: fraud-reports}}]
---
apiVersion: v1
kind: Service
metadata: {name: api, namespace: fraudshield}
spec: {selector: {app: api}, ports: [{port: 8000}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: consumer, namespace: fraudshield}
spec:
  replicas: 1                 # scale up to the topic's partition count (3); per-user ordering is preserved by message keys
  selector: {matchLabels: {app: consumer}}
  template:
    metadata: {labels: {app: consumer}}
    spec:
      enableServiceLinks: false
      securityContext: {fsGroup: 1000}
      containers:
        - name: consumer
          image: fraudshield-serve:latest
          imagePullPolicy: Never
          command: ["python", "-m", "fraudshield.consumer"]
          envFrom: [{configMapRef: {name: fraud-config}}]
          env: [{name: API_KEY, valueFrom: {secretKeyRef: {name: fraud-secrets, key: API_KEY}}}, {name: DATABASE_URL, value: "postgresql+psycopg2://fraud:change-me@postgres:5432/fraud"}]
          volumeMounts: [{name: data, mountPath: /app/data}, {name: artifacts, mountPath: /app/artifacts}, {name: reports, mountPath: /app/reports}]
      volumes: [{name: data, persistentVolumeClaim: {claimName: fraud-data}}, {name: artifacts, persistentVolumeClaim: {claimName: fraud-artifacts}}, {name: reports, persistentVolumeClaim: {claimName: fraud-reports}}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: dashboard, namespace: fraudshield}
spec:
  replicas: 1
  selector: {matchLabels: {app: dashboard}}
  template:
    metadata: {labels: {app: dashboard}}
    spec:
      enableServiceLinks: false
      containers:
        - name: dashboard
          image: fraudshield-dashboard:latest
          imagePullPolicy: Never
          ports: [{containerPort: 8501}]
          env:
            - {name: API_URL, value: "http://api:8000"}
            - {name: API_KEY, valueFrom: {secretKeyRef: {name: fraud-secrets, key: API_KEY}}}
---
apiVersion: v1
kind: Service
metadata: {name: dashboard, namespace: fraudshield}
spec: {type: NodePort, selector: {app: dashboard}, ports: [{port: 8501, nodePort: 30501}]}
---
apiVersion: batch/v1
kind: CronJob
metadata: {name: drift-check, namespace: fraudshield}
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          enableServiceLinks: false
          containers:
            - name: drift
              image: fraudshield-train:latest
              imagePullPolicy: Never
              command: ["python", "-m", "fraudshield.monitoring", "--retrain-if-needed"]
              envFrom: [{configMapRef: {name: fraud-config}}]
              env: [{name: API_KEY, valueFrom: {secretKeyRef: {name: fraud-secrets, key: API_KEY}}}, {name: DATABASE_URL, value: "postgresql+psycopg2://fraud:change-me@postgres:5432/fraud"}]
              volumeMounts: [{name: data, mountPath: /app/data}, {name: artifacts, mountPath: /app/artifacts}, {name: reports, mountPath: /app/reports}]
          volumes: [{name: data, persistentVolumeClaim: {claimName: fraud-data}}, {name: artifacts, persistentVolumeClaim: {claimName: fraud-artifacts}}, {name: reports, persistentVolumeClaim: {claimName: fraud-reports}}]
